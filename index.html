<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Реквием - Мир Бесконечной Скорби</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-dark: #0a0a0f;
            --bg-card: #141419;
            --border-color: #2a2a35;
            --text-primary: #e8e8f0;
            --text-secondary: #a8a8b8;
            --accent-red: #8b2c3f;
            --accent-gold: #b8964f;
            --shadow: rgba(139, 44, 63, 0.3);
        }

        body {
            font-family: 'Crimson Text', serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            line-height: 1.8;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(139, 44, 63, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(184, 150, 79, 0.05) 0%, transparent 50%);
        }

        /* Header */
        header {
            position: sticky;
            top: 0;
            background: rgba(10, 10, 15, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            padding: 1.5rem 2rem;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            background: linear-gradient(135deg, var(--accent-red), var(--accent-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px var(--shadow);
        }

        nav {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .nav-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 0.6rem 1.2rem;
            cursor: pointer;
            font-family: 'Cinzel', serif;
            font-size: 0.9rem;
            letter-spacing: 0.05em;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .nav-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(139, 44, 63, 0.3), transparent);
            transition: left 0.5s ease;
        }

        .nav-btn:hover::before {
            left: 100%;
        }

        .nav-btn:hover {
            color: var(--accent-red);
            border-color: var(--accent-red);
            box-shadow: 0 0 15px var(--shadow);
        }

        .nav-btn.active {
            background: var(--accent-red);
            color: var(--text-primary);
            border-color: var(--accent-red);
        }

        /* Main Content */
        main {
            max-width: 1200px;
            margin: 4rem auto;
            padding: 0 2rem;
        }

        .content-section {
            display: none;
            animation: fadeIn 0.6s ease;
        }

        .content-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .article {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 3rem;
            margin-bottom: 3rem;
            position: relative;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
        }

        .article::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(180deg, var(--accent-red), var(--accent-gold));
        }

        .article h2 {
            font-family: 'Cinzel', serif;
            font-size: 2rem;
            margin-bottom: 1.5rem;
            color: var(--accent-gold);
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .article h3 {
            font-family: 'Cinzel', serif;
            font-size: 1.4rem;
            margin: 2rem 0 1rem;
            color: var(--accent-red);
            letter-spacing: 0.05em;
        }

        .article p {
            font-size: 1.15rem;
            margin-bottom: 1.2rem;
            text-align: justify;
            color: var(--text-secondary);
        }

        .article em {
            color: var(--text-primary);
            font-style: italic;
        }

        .article strong {
            color: var(--accent-gold);
            font-weight: 600;
        }

        .quote {
            border-left: 3px solid var(--accent-red);
            padding-left: 2rem;
            margin: 2rem 0;
            font-style: italic;
            color: var(--text-primary);
            position: relative;
        }

        .quote::before {
            content: '"';
            position: absolute;
            left: -0.5rem;
            top: -1rem;
            font-size: 4rem;
            color: var(--accent-red);
            opacity: 0.3;
            font-family: 'Cinzel', serif;
        }

        /* Media Elements */
        .media-container {
            margin: 2rem 0;
        }

        .image-wrapper {
            position: relative;
            overflow: hidden;
            border: 2px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            margin: 2rem 0;
        }

        .image-wrapper img {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.5s ease;
        }

        .image-wrapper:hover img {
            transform: scale(1.05);
        }

        .audio-player {
            background: rgba(42, 42, 53, 0.5);
            border: 1px solid var(--border-color);
            padding: 1rem;
            margin: 1rem 0;
            display: flex;
            align-items: center;
            gap: 1rem;
            transition: all 0.3s ease;
        }

        .audio-player:hover {
            background: rgba(42, 42, 53, 0.8);
            border-color: var(--accent-red);
        }

        .audio-player audio {
            flex: 1;
            height: 40px;
        }

        .audio-label {
            font-family: 'Cinzel', serif;
            font-size: 0.9rem;
            color: var(--accent-gold);
            letter-spacing: 0.05em;
            min-width: 120px;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 3rem 2rem;
            margin-top: 4rem;
            border-top: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        footer p {
            margin: 0.5rem 0;
        }

        /* Decorative elements */
        .divider {
            width: 100px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-red), transparent);
            margin: 3rem auto;
        }

        /* Responsive */
        @media (max-width: 768px) {
            h1 {
                font-size: 1.5rem;
            }

            .article {
                padding: 2rem 1.5rem;
            }

            .article h2 {
                font-size: 1.5rem;
            }

            nav {
                width: 100%;
                justify-content: center;
            }

            .header-content {
                justify-content: center;
                text-align: center;
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-dark);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--accent-red);
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-gold);
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <h1>РЕКВИЕМ</h1>
            <nav id="navigation">
                <!-- Navigation will be generated by JavaScript -->
            </nav>
        </div>
    </header>

    <main id="content">
        <!-- Content will be loaded here -->
    </main>

    <footer>
        <div class="divider"></div>
        <p>Материалы для настольной ролевой игры</p>
        <p>Мир "Реквием" © 2026</p>
    </footer>

    <script>
        // Content data structure
        const content = {

                    {
                        type: 'text',
                        content: `Мир, нареченный Реквиемом, замер на краю бездны. Долгая и кровопролитная война за Висцерит между индустриальной Лакримозой, стальной Аркнийской империей и прагматичным Весперским союзом зашла в тупик. Хрупкий мир, купленный ценой миллионов жизней, продлился лишь несколько лет — пока сама Смерть не покинула это пепелище.`

                    {
                        type: 'text',
                        content: `Остановка смерти исказила законы бытия. То, что должно было стать спасением, превратилось в повод для новой, ещё более яростной Жатвы. Пока корпорации и бароны Висцерита вцепляются в горло реальности, пытаясь удержать ускользающую власть, само человечество столкнулось с абсолютным концом. Учёные называют это "разрывом циркуляции душ", но истина проще и страшнее: колыбели Лакримозы пусты. В мире, где никто не может умереть, больше никто не может родиться. Дети приходят в этот мир уже мёртвыми, оставляя живых наедине с их вечностью. Именно здесь, в сумерках человеческого рода, начинается наша история.`
                    }
                ]
            },
            'requiem': {
                title: 'Реквием',
                sections: [
                    {
                        type: 'text',
                        content: `Событие, берущее начало в 732 году от образования трёх государств.
Дамьен Лафоэль - строитель, что имел неосторожность упасть со строительных лесов и сломать позвоночник, не умер.
Хоть поначалу его случай окрестили чудом, вскоре стало понятно, что смерти больше нет.`
                    },
                    {
                        type: 'heading',
                        content: 'Заметки хирурга Кальтроса Лестийского'
                    },
                    {
                        type: 'quote',
                        content: `<strong><em>Mors recessit</em></strong><br>
<em>Пациент Лафоэль - уникальный и первый случай за долгие годы моей работы...</em><br>
<em>Позвоночник господина Лафоэля переломан в области 7 шейного, 4 и 9 грудных позвонков. Множественные переломы конечностей, грудной клетки. Обильное наличие гематом и ушибов по всему телу.</em><br>
<em>С высоты моих знаний ответственно заявляю, что данный случай на 100% обязан был привести к летальному исходу, однако...жизнь умеет удивлять.</em>`
                    },
                    {
                        type: 'image',
                        src: 'img/photo_2026-02-14_14-31-44.jpg',

                    }
                ]
            },
            'viscera': {
                title: 'Висцерит',
                sections: [
                    {
                        type: 'text',
                        content: `<strong>«672 год: Начало Эпохи Висцерита»</strong><br>
В 672 году исследовательские отряды Лакримозы погрузились внутрь глубоководной расщелины в Море Звёзд. То, что они обнаружили, навсегда разделило историю мира на «до» и «после». Вещество, получившее название Висцерит, представляло собой вязкую, перламутрово-алую жидкость, обладавшую необъяснимой природой.`

                            { src: 'voice/2.m4a', label: 'Запись 2' },
                            { src: 'voice/3.m4a', label: 'Запись 3' },
                            { src: 'voice/4.m4a', label: 'Запись 4' }
                        ]
                    }
                ]
            },
            'lacrimosa': {
                title: 'Лакримоза',

                    {
                        type: 'text',
                        content: `Лакримоза некогда была колыбелью искусств и тихой гаванью просвещения. Но всё изменилось, когда из бездны Моря Звёзд поднялся Висцерит. Город совершил невозможный прыжок, на десятилетия обогнав само время, и превратился в пульсирующее сердце индустриального мира.`
                    },
                    {
                        type: 'text',
                        content: `Сегодня улицы Лакримозы — это лабиринт из меди, пара и алого сияния. Висцерит течёт по венам огромной сети труб, питая фонари, заставляя реветь заводы и мчать по рельсам тяжёлые составы. Но этот триумф разума пришёл не один: за право обладать "живым топливом" мир захлебнулся в новой, ещё более яростной войне. И пока на границах полыхает огонь, внутри самой Лакримозы зреет другой раскол. Старая власть — король и его верные рыцари, прозванные "Слезами", — медленно отступает в тень. Трон, веками стоявший незыблемо, теперь меркнет перед холодным блеском корпоративного золота и мощью тех, кто обуздал энергию алого перламутра. Прогресс не просто изменил город — он лишил его души, заменив её неутомимым биением поршней.`
                    }
                ]
            },
            'arknia': {
                title: 'Аркнийская империя',
                sections: [
                    {
                        type: 'text',
                        content: `Аркнийская империя — это монументальный памятник эпохе пара и железа, возвышающийся среди суровых горных хребтов к северо-востоку от Лакримозы. До открытия Висцерита Аркния была бесспорным гегемоном мира, диктуя волю через мощь своей артиллерии и непреклонную дисциплину легионов. Однако смена энергетической парадигмы в 672 году превратила империю в угасающего исполина. Оказавшись на географической периферии Висцеритных разломов, Аркния столкнулась с «Железным Голодом» — дефицитом ресурса, который стал новой кровью цивилизации.`
                    },
                    {
                        type: 'text',
                        content: `Внутреннее устройство Империи подчинено философии Вечного Служения. В мире, где Смерть остановилась, аркнийцы возвели порядок в абсолют: каждый гражданин — от потомственного инженера до бессмертного гвардейца — считается незаменимым винтиком в грандиозной государственной машине. Здесь не терпят хаоса корпораций и лихорадочного блеска Лакримозы. Жизнь в Аркнии протекает в величественном полумраке бруталистских городов из гранита и стали, где Висцерит является строжайшим дефицитом, доступным лишь высшим эшелонам власти или через опасные каналы чёрного рынка.`

                    {

            'tears': {

                    {
                        type: 'quote',

                    {

                    {

Каждому присваивается "место" на татуировке ровно как роль в отряде, формация которого определена ещё с самих истоков возникновения этой силы.`
                    },
                    {
                        type: 'text',
                        content: `<strong>Аркс</strong> - задний строй, универсальный боец, готовый поддержать любого из строя.<br>

<strong>Рейзор</strong> - верхний край вокса, решительность и тень отряда.<br>
<strong>Вокс</strong> - центр, голос и сила команды.<br>
<strong>Поток</strong> - разведчик, глаза группы.<br>
<strong>Исток</strong> - лидер, навигатор и сердце команды.`
                    },
                    {
                        type: 'text',
                        content: `Каждый из Слёз имеет особые способности, в основе которых лежит пространственная и ментальная сила.`
                    },
                    {
                        type: 'image',
                        src: 'img/photo_2026-02-14_14-39-20.jpg',
                        alt: 'Структура ордена Слёз Короля'
                    }
                ]
            }
        };

        // Navigation items
        const navItems = [
            { id: 'intro', label: 'Введение' },
            { id: 'requiem', label: 'Реквием' },
            { id: 'viscera', label: 'Висцерит' },
            { id: 'lacrimosa', label: 'Лакримоза' },
            { id: 'arknia', label: 'Аркния' },
            { id: 'tears', label: 'Слёзы Короля' }
        ];

        // Generate navigation
        function generateNavigation() {
            const nav = document.getElementById('navigation');
            navItems.forEach(item => {
                const btn = document.createElement('button');
                btn.className = 'nav-btn';
                btn.textContent = item.label;
                btn.onclick = () => showContent(item.id);
                nav.appendChild(btn);
            });
        }

        // Render content
        function renderContent(sections) {
            let html = '';
            sections.forEach(section => {
                switch(section.type) {
                    case 'text':
                        html += `<p>${section.content}</p>`;
                        break;
                    case 'heading':
                        html += `<h3>${section.content}</h3>`;
                        break;
                    case 'quote':
                        html += `<div class="quote">${section.content}</div>`;
                        break;
                    case 'image':
                        html += `<div class="image-wrapper"><img src="${section.src}" alt="${section.alt}"></div>`;
                        break;
                    case 'audio':
                        html += '<div class="media-container">';
                        section.files.forEach(file => {
                            html += `
                                <div class="audio-player">
                                    <span class="audio-label">${file.label}</span>
                                    <audio controls>
                                        <source src="${file.src}" type="audio/mp4">
                                        Ваш браузер не поддерживает аудио элемент.
                                    </audio>
                                </div>
                            `;
                        });
                        html += '</div>';
                        break;
                }
            });
            return html;
        }

        // Show content section
        function showContent(id) {
            // Remove active class from all sections and buttons
            document.querySelectorAll('.content-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
            
            // Add active class to current button
            const buttons = document.querySelectorAll('.nav-btn');
            const index = navItems.findIndex(item => item.id === id);
            if (index !== -1) {
                buttons[index].classList.add('active');
            }
            
            // Show content
            let section = document.getElementById(id);
            if (!section) {
                section = document.createElement('div');
                section.id = id;
                section.className = 'content-section';
                const pageContent = content[id];
                section.innerHTML = `
                    <article class="article">
                        <h2>${pageContent.title}</h2>
                        ${renderContent(pageContent.sections)}
                    </article>
                `;
                document.getElementById('content').appendChild(section);
            }
            section.classList.add('active');
            
            // Scroll to top
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            generateNavigation();
            showContent('intro');
        });
    </script>
</body>
</html>
